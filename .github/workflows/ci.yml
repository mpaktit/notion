name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: E2E smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run preview &
          npx --yes wait-on http://localhost:4173
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
